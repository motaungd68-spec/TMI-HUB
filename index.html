<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>TMI Casework Hub</title>
<meta name="theme-color" content="#1F3864" />
<meta name="description" content="TMI Casework Hub — offline-first casework management for Legal & Administrative Casework Consultancy." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
:root{
  --navy:#1F3864; --navy-dark:#152848; --gold:#8C6D46; --gold-light:#c9a877;
  --charcoal:#333; --line:#e2e2e2; --cream:#F5F1EA; --white:#fff; --grey:#6b6b6b;
  --red:#b3261e; --amber:#a56a1d; --green:#2e7d4f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--cream);font-family:-apple-system,Roboto,Arial,sans-serif;color:var(--charcoal)}
h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif;color:var(--navy);margin:0 0 8px}
a{color:var(--navy)}
button{font-family:inherit;cursor:pointer}
#app{padding-bottom:70px;min-height:100vh}
.header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.header .menu-btn{background:none;border:none;color:#fff;font-size:22px;padding:4px 8px}
.header .title{font-family:Georgia,serif;font-weight:700;font-size:18px;flex:1}
.header .sub{font-size:11px;color:#b9c3d9;display:block}
.container{padding:14px;max-width:720px;margin:0 auto}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.eyebrow{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center;display:block;text-decoration:none;color:inherit}
.stat-card:active{background:#f7f7f7}
.stat-card .num{font-size:26px;font-weight:700;color:var(--navy);font-family:Georgia,serif}
.stat-card.alert .num{color:var(--red)}
.stat-card .lbl{font-size:12px;color:var(--grey);margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.card:active{background:#fafafa}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.case-num{font-family:Georgia,serif;font-weight:700;color:var(--navy);font-size:15px}
.case-sub{font-size:12.5px;color:var(--grey);margin-top:2px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:10px;white-space:nowrap;text-transform:uppercase}
.pill-navy{background:#e7ecf5;color:var(--navy)}
.pill-amber{background:#fbeedd;color:var(--amber)}
.pill-red{background:#fbe4e2;color:var(--red)}
.pill-green{background:#e3f2e9;color:var(--green)}
.pill-grey{background:#eee;color:#666}
.next-action{margin-top:6px;font-size:12.5px;color:var(--charcoal);background:var(--cream);padding:6px 8px;border-radius:6px}
.next-action b{color:var(--navy)}
.overdue-text{color:var(--red);font-weight:700}
.fab{position:fixed;right:18px;bottom:82px;background:var(--gold);color:#fff;border:none;width:54px;height:54px;border-radius:50%;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:15}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20}
.bottomnav button{flex:1;background:none;border:none;padding:9px 2px 8px;font-size:10.5px;color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:2px}
.bottomnav button.active{color:var(--navy);font-weight:700}
.bottomnav .ic{font-size:18px}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
.drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:#fff;z-index:31;transform:translateX(-100%);transition:transform .2s;padding:16px 0;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer-overlay.open{display:block}
.drawer h3{padding:0 16px;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.drawer a{display:block;padding:10px 16px;color:var(--charcoal);text-decoration:none;font-size:14.5px;border-left:3px solid transparent}
.drawer a:active,.drawer a.active{background:var(--cream);border-left-color:var(--gold);color:var(--navy);font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:40;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:#fff;width:100%;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px}
@media(min-width:620px){.modal-overlay{align-items:center;justify-content:center}.modal{max-width:560px;border-radius:12px}}
.modal h2{font-size:19px}
.modal-close{float:right;background:none;border:none;font-size:22px;color:var(--grey)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:15px;font-family:inherit;background:#fff}
textarea{resize:vertical}
.btn{display:inline-block;border:none;border-radius:6px;padding:11px 18px;font-weight:700;font-size:14.5px;text-decoration:none;text-align:center}
.btn-primary{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-outline{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn-danger{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn-block{display:block;width:100%;margin-top:16px}
.btn-sm{padding:6px 12px;font-size:12.5px}
.tabbar{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:2px}
.tabbar button{background:none;border:none;padding:8px 8px;font-size:12.5px;color:var(--grey);white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.tabbar button.active{color:var(--navy);font-weight:700;border-bottom-color:var(--gold)}
.field-view{margin-bottom:10px;font-size:14px}
.field-view .fk{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--gold);font-weight:700;display:block;margin-bottom:2px}
.field-view .fv{white-space:pre-wrap}
.empty{text-align:center;color:var(--grey);padding:30px 10px;font-size:14px}
.searchbox{position:sticky;top:56px;background:var(--cream);padding:10px 14px;z-index:10}
.searchbox input{background:#fff}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.small{font-size:12px;color:var(--grey)}
.timeline-item{border-left:2px solid var(--line);padding:0 0 14px 14px;margin-left:5px;position:relative}
.timeline-item:before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.timeline-date{font-size:11px;color:var(--grey);font-weight:700}
.linkline{word-break:break-all}
.footer-note{text-align:center;font-size:11px;color:#999;padding:14px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:50;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <button class="menu-btn" onclick="openDrawer()">&#9776;</button>
  <div><span class="title">TMI Casework Hub</span><span class="sub">Legal &amp; Administrative Casework</span></div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <h3>Workflow</h3>
  <a href="#/dashboard" onclick="closeDrawer()">Dashboard</a>
  <a href="#/enquiries" onclick="closeDrawer()">Enquiries</a>
  <a href="#/clients" onclick="closeDrawer()">Clients</a>
  <a href="#/cases" onclick="closeDrawer()">Cases</a>
  <h3>Operations</h3>
  <a href="#/tasks" onclick="closeDrawer()">Tasks</a>
  <a href="#/documents" onclick="closeDrawer()">Documents</a>
  <a href="#/communications" onclick="closeDrawer()">Communications</a>
  <a href="#/search" onclick="closeDrawer()">Search</a>

  <a href="#/manual" onclick="closeDrawer()">Operating Manual (T01&ndash;T16)</a>
  <a href="#/settings" onclick="closeDrawer()">Backup &amp; Settings</a>
</div>

<div id="app"></div>

<button class="fab" id="fab" style="display:none" onclick="fabAction()">+</button>

<div class="bottomnav">
  <button data-r="dashboard" onclick="location.hash='#/dashboard'"><span class="ic">&#8962;</span>Home</button>
  <button data-r="enquiries" onclick="location.hash='#/enquiries'"><span class="ic">&#9993;</span>Enquiries</button>
  <button data-r="cases" onclick="location.hash='#/cases'"><span class="ic">&#128193;</span>Cases</button>
  <button data-r="tasks" onclick="location.hash='#/tasks'"><span class="ic">&#10003;</span>Tasks</button>
  <button data-r="search" onclick="location.hash='#/search'"><span class="ic">&#128269;</span>Search</button>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============== CONSTANTS ============== */
const CASE_STATUSES = [
  ['NEW','New','grey'],['INTAKE','Intake','grey'],['ASSESSMENT','Assessment','amber'],
  ['AWAITING_ENGAGEMENT','Awaiting Engagement','amber'],['ACTIVE','Active Casework','navy'],
  ['AWAITING_CLIENT','Awaiting Client','amber'],['AWAITING_THIRD_PARTY','Awaiting Third Party','amber'],
  ['FOLLOW_UP','Follow-Up','amber'],['ESCALATION_REFERRAL','Escalation / Referral','red'],
  ['RESOLUTION','Resolution','green'],['CLOSED','Closed','grey']
];
const ENQUIRY_STATUSES = [
  ['NEW','New','grey'],['CONTACTED','Contacted','navy'],['INFORMATION_GATHERING','Information Gathering','amber'],
  ['ASSESSMENT_REQUIRED','Assessment Required','amber'],['ASSESSMENT_BOOKED','Assessment Booked','navy'],
  ['PROCEEDING','Proceeding (Converted)','green'],['NOT_PROCEEDING','Not Proceeding','grey']
];
const TASK_STATUSES = [['TO_DO','To Do'],['IN_PROGRESS','In Progress'],['WAITING','Waiting'],['COMPLETED','Completed'],['CANCELLED','Cancelled']];
const PRIORITIES = [['LOW','Low'],['NORMAL','Normal'],['HIGH','High']];
const CATEGORIES = ['Money & Benefits','Estates & Inheritance','Disputes & Complaints','Contracts & Property','Institutional Problems','Administrative / Other'];
const CHANNELS = ['WhatsApp','Email','Phone','Meeting','Letter','Website','Other'];
const DIRECTIONS = ['Inbound','Outbound'];
const DOC_TYPES = ['Identification','Client Evidence','Institutional Record','Contract','Court/Legal Document','Correspondence','Research','Draft','Submission','Response','Final','Other'];
const ASSESS_OUTCOMES = ['Proceed','Proceed Subject to Information','Refer','Outside TMI Scope','No Further Action','Client Declined'];
const WORK_TYPES = {
  'Money & Benefits': ['Money Tracing','Entitlement Assessment','Claim Preparation'],
  'Estates & Inheritance': ['Estate Investigation','Beneficiary Dispute','Executor Correspondence'],
  'Disputes & Complaints': ['Dispute Preparation','Institutional Complaint','CCMA/Ombud Preparation'],
  'Contracts & Property': ['Contract Review','Contract Drafting','Property Matter'],
  'Institutional Problems': ['Institutional Follow-up','Benefits/Account Problem'],
  'Administrative / Other': ['Document Preparation','Research Memorandum','General Casework']
};
const CHECKLIST_TEMPLATES = {
  'Contract Review': ['Confirm parties and authority to sign','Confirm subject matter/property correctly identified','Check payment amounts, dates and escalation','Check duration, renewal and termination terms','Check liability, indemnity and dispute mechanism','Note missing or unclear clauses','Prepare recommended changes'],
  'Contract Drafting': ['Confirm instructions and objective','Identify required clauses','Draft agreement','Client review','Finalise and deliver'],
  'Estate Investigation': ['Obtain death certificate','Obtain L&D account','Confirm beneficiaries','Reconstruct family relationships','Identify discrepancies in distribution','Draft correspondence to executor/Master'],
  'Beneficiary Dispute': ['Confirm relationship to deceased','Review will/intestate succession position','Identify basis of dispute','Gather supporting documents','Draft correspondence'],
  'Executor Correspondence': ['Confirm executor details','Set out request clearly','Draft letter','Send and record date','Diarise follow-up'],
  'Money Tracing': ['Confirm entitlement basis','Search relevant registers/institution','Confirm identity documents required','Prepare claim submission','Track submission status'],
  'Entitlement Assessment': ['Confirm what entitlement is claimed','Gather supporting evidence','Assess likely validity','Advise client of route'],
  'Claim Preparation': ['Confirm claim requirements','Gather documents','Complete claim submission','Submit and record reference','Track response'],
  'Institutional Complaint': ['Identify correct institution/department','Gather chronology and evidence','Draft complaint','Submit and record reference number','Track response deadline'],
  'Dispute Preparation': ['Establish facts and chronology','Identify parties','Identify procedural route','Gather evidence','Prepare submission'],
  'CCMA/Ombud Preparation': ['Confirm jurisdiction and time limits','Gather chronology and evidence','Complete referral/complaint form','Prepare supporting bundle','Confirm filing'],
  'Institutional Follow-up': ['Confirm reference number','Confirm last contact date','Draft follow-up','Escalate if no response'],
  'Document Preparation': ['Confirm purpose and audience of document','Gather supporting facts/evidence','Draft document','Client review','Finalise and deliver'],
  'Research Memorandum': ['Confirm research question','Identify sources','Research and record findings','Draft memorandum','Review conclusions']
};

const KEYS = ['clients','enquiries','cases','tasks','communications','documents','drafts','manual','settings'];
let DB = {clients:[],enquiries:[],cases:[],tasks:[],communications:[],documents:[],drafts:[],manual:[],settings:{nextSeq:1,seqYear:new Date().getFullYear()}};
const MANUAL_CODES = Array.from({length:16},(_,i)=>'T'+String(i+1).padStart(2,'0'));
function ensureManual(){
  if(!Array.isArray(DB.manual)) DB.manual = [];
  MANUAL_CODES.forEach(code=>{
    if(!DB.manual.find(m=>m.code===code)) DB.manual.push({code, title:'', body:'', fileId:null, fileName:null, fileType:null, updated:''});
  });
}
function manualByCode(code){ return DB.manual.find(m=>m.code===code); }

/* ============== DOCUMENT TEMPLATES ============== */
function letterHeader(c,cl,date){
  return `TMI — Legal & Administrative Casework Consultancy\n${fmtDate(date)}\n\nRe: ${c.title} (Ref: ${c.id})\n${cl?('Client: '+cl.name):''}\n\n`;
}
function letterFooter(){
  return `\n\nRegards,\nTMI\ntmi.legaladmin@gmail.com | +27 75 997 3396`;
}
function reportHeader(c,cl,date){
  return `CASE ASSESSMENT REPORT\nCase: ${c.id} — ${c.title}\nClient: ${cl?cl.name:'—'}\nDate: ${fmtDate(date)}\n\n`;
}
const TEMPLATES = {
  assessment_report: { label:'Case Assessment Report', kind:'report', fields:[],
    bodyBuilder:(c)=>{ const a=c.assessment||{};
      return [['ISSUE',a.issue],['FACTS ESTABLISHED',a.facts],['MISSING INFORMATION',a.missingInfo],
        ['RELEVANT PARTIES',a.parties],['RELEVANT INSTITUTION',a.institution],['RESEARCH NOTES',a.researchNotes],
        ['POSSIBLE ROUTES',a.routes],['RECOMMENDED NEXT STEP',a.recommendedNext],['SCOPE OF TMI WORK',a.scope],
        ['LIMITATIONS',a.limitations],['REFERRAL REQUIRED',a.referralRequired],['ASSESSMENT OUTCOME',a.outcome]
      ].map(([k,v])=>k+'\n'+(v||'—')).join('\n\n'); } },
  engagement_letter: { label:'Engagement Letter (Scope & Fee)', kind:'letter',
    fields:[
      {name:'scopeText',label:'Scope of Work',type:'textarea',default:c=>(c.assessment&&c.assessment.scope)||''},
      {name:'feeText',label:'Fee Arrangement',type:'text',default:c=>c.feeArrangement||''},
      {name:'timeline',label:'Expected Timeline',type:'text',default:()=>''},
      {name:'closing',label:'Closing note',type:'textarea',default:()=>'Please confirm your acceptance of this scope and fee so that TMI can proceed.'}],
    bodyBuilder:(c,cl,v)=>`Dear ${cl?cl.name:'Client'},\n\nFollowing TMI's assessment of your matter (${c.id} — ${c.title}), TMI proposes to proceed on the following basis:\n\nSCOPE OF WORK\n${v.scopeText||'—'}\n\nFEE\n${v.feeText||'—'}\n\nEXPECTED TIMELINE\n${v.timeline||'—'}\n\n${v.closing||''}` },
  institution_letter: { label:'Institution / Third-Party Correspondence', kind:'letter',
    fields:[
      {name:'institutionName',label:'Institution / Recipient',type:'text',default:c=>(c.assessment&&c.assessment.institution)||''},
      {name:'referenceNumber',label:"Their reference (if any)",type:'text',default:()=>''},
      {name:'requestBody',label:'Request / Enquiry',type:'textarea',default:()=>''}],
    bodyBuilder:(c,cl,v)=>`To: ${v.institutionName||'—'}\n${v.referenceNumber?('Your ref: '+v.referenceNumber+'\n'):''}\nTMI writes on behalf of our client, ${cl?cl.name:'—'}, in connection with the above matter (TMI ref: ${c.id}).\n\n${v.requestBody||'—'}\n\nWe would be grateful for your response at your earliest convenience.` },
  client_update: { label:'Client Update Letter', kind:'letter',
    fields:[{name:'updateBody',label:'Update to client',type:'textarea',default:c=>c.nextAction||''}],
    bodyBuilder:(c,cl,v)=>`Dear ${cl?cl.name:'Client'},\n\nAn update on your matter (${c.id} — ${c.title}):\n\n${v.updateBody||'—'}\n\nWe will keep you informed as the matter progresses.` },
  closure_report: { label:'Closure / Outcome Letter', kind:'letter', fields:[],
    bodyBuilder:(c,cl)=>{ const z=c.closure||{};
      return `Dear ${cl?cl.name:'Client'},\n\nThis letter confirms the closure of your matter (${c.id} — ${c.title}).\n\nOUTCOME\n${z.outcome||'—'}\n\nWORK COMPLETED\n${z.workCompleted||'—'}\n\nOUTSTANDING MATTERS\n${z.outstanding||'—'}\n\nDocuments delivered: ${z.documentsDelivered?'Yes':'No'}\nReferral made: ${z.referralMade?'Yes':'No'}\n\nThank you for the opportunity to assist with this matter.`; } },
  blank: { label:'Blank Document', kind:'letter',
    fields:[{name:'body',label:'Body',type:'textarea',default:()=>''}],
    bodyBuilder:(c,cl,v)=>v.body||'' }
};
function fullDocText(d,c,cl){
  const t = TEMPLATES[d.templateKey]; const date = d.values.docDate || d.created || todayStr();
  const body = t.bodyBuilder(c,cl,d.values||{});
  return t.kind==='report' ? reportHeader(c,cl,date)+body : letterHeader(c,cl,date)+body+letterFooter();
}

/* ============== STORAGE (real browser persistence) ============== */
/* IMPORTANT: window.storage only exists inside Claude's own preview pane —
   it does NOT exist when this file is opened directly as a downloaded file
   on your phone. That was the cause of "it forgets everything." Fixed by
   using localStorage, which is a real, permanent part of your phone's
   browser and survives closing the app/tab/browser. It's cleared only if
   you clear that browser's site data — which is exactly why Settings has
   an Export Backup button; use it. */
const LS_PREFIX = 'tmihub_v1_';
function loadDB(){
  for(const k of KEYS){
    try{
      const raw = localStorage.getItem(LS_PREFIX+k);
      DB[k] = raw ? JSON.parse(raw) : (k==='settings' ? DB.settings : []);
    }catch(e){ DB[k] = (k==='settings') ? DB.settings : []; }
  }
  ensureManual();
  route();
}
function saveKey(k){
  try{ localStorage.setItem(LS_PREFIX+k, JSON.stringify(DB[k])); }
  catch(e){ toast('Save failed — device storage may be full'); }
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

/* ============== FILE STORAGE (IndexedDB) ==============
   Real documents (PDFs, photos of ID/estate papers, scans) are stored on
   this device using IndexedDB — the browser's own file-capable database.
   No cloud, no account, no cost. They stay on THIS phone/browser only,
   which is why each document also has an optional external link field for
   anything you'd rather keep in your own Drive/Dropbox as well. */
let _idb = null;
function openIDB(){
  if(_idb) return Promise.resolve(_idb);
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('tmihub_files_v1', 1);
    req.onupgradeneeded = (e)=>{ const db=e.target.result; if(!db.objectStoreNames.contains('files')) db.createObjectStore('files',{keyPath:'id'}); };
    req.onsuccess = (e)=>{ _idb=e.target.result; resolve(_idb); };
    req.onerror = (e)=> reject(e.target.error);
  });
}
function idbPut(record){ return openIDB().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').put(record); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function idbGet(id){ return openIDB().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('files','readonly'); const rq=tx.objectStore('files').get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); })); }
function idbDelete(id){ return openIDB().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }

/* ============== UTIL ============== */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}); }
function statusMeta(list,code){ const f=list.find(x=>x[0]===code); return f?{label:f[1],color:f[2]}:{label:code,color:'grey'}; }
function isOverdue(due,status){ return due && due<todayStr() && !['COMPLETED','CANCELLED','CLOSED'].includes(status); }
function nextCaseNumber(){
  const y = new Date().getFullYear();
  if(DB.settings.seqYear !== y){ DB.settings.seqYear = y; DB.settings.nextSeq = 1; }
  const n = DB.settings.nextSeq; DB.settings.nextSeq = n+1;
  saveKey('settings');
  return 'TMI-'+y+'-'+String(n).padStart(4,'0');
}
function clientById(id){ return DB.clients.find(c=>c.id===id); }
function caseById(id){ return DB.cases.find(c=>c.id===id); }
function tasksForCase(id){ return DB.tasks.filter(t=>t.caseId===id).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')); }
function commsForCase(id){ return DB.communications.filter(c=>c.caseId===id).sort((a,b)=>b.date.localeCompare(a.date)); }
function docsForCase(id){ return DB.documents.filter(d=>d.caseId===id); }

/* ============== ROUTER ============== */
window.addEventListener('hashchange', route);
function route(){
  const full = location.hash.replace('#/','') || 'dashboard';
  const [pathPart, queryPart] = full.split('?');
  const [base, id] = pathPart.split('/');
  const params = new URLSearchParams(queryPart||'');
  document.querySelectorAll('.bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.r===base));
  const app = document.getElementById('app');
  const fab = document.getElementById('fab');
  fab.style.display='none';
  try{
    if(base==='dashboard') app.innerHTML = viewDashboard();
    else if(base==='enquiries') { app.innerHTML = viewEnquiries(params); fab.style.display='block'; fab.dataset.mode='enquiry'; }
    else if(base==='enquiry' && id) app.innerHTML = viewEnquiryDetail(id);
    else if(base==='clients') { app.innerHTML = viewClients(); fab.style.display='block'; fab.dataset.mode='client'; }
    else if(base==='client' && id) app.innerHTML = viewClientDetail(id);
    else if(base==='cases') { app.innerHTML = viewCases(params); fab.style.display='block'; fab.dataset.mode='case'; }
    else if(base==='case' && id) app.innerHTML = viewCaseDetail(id);
    else if(base==='draft' && id) app.innerHTML = viewDraftEditor(id);
    else if(base==='tasks') { app.innerHTML = viewTasks(params); fab.style.display='block'; fab.dataset.mode='task'; }
    else if(base==='documents') { app.innerHTML = viewDocuments(); fab.style.display='block'; fab.dataset.mode='document'; }
    else if(base==='communications') { app.innerHTML = viewComms(); fab.style.display='block'; fab.dataset.mode='communication'; }
    else if(base==='search') app.innerHTML = viewSearch();
    else if(base==='manual') app.innerHTML = viewManual();
    else if(base==='manualitem' && id) app.innerHTML = viewManualItem(id);
    else if(base==='casereport' && id) app.innerHTML = viewCaseReport(id);
    else if(base==='settings') app.innerHTML = viewSettings();
    else app.innerHTML = viewDashboard();
  }catch(e){ app.innerHTML = '<div class="container empty">Something went wrong rendering this screen.<br><span class="small">'+esc(e.message)+'</span></div>'; }
  window.scrollTo(0,0);
}
function fabAction(){
  const mode = document.getElementById('fab').dataset.mode;
  if(mode==='enquiry') openEnquiryForm();
  else if(mode==='client') openClientForm();
  else if(mode==='case') openCaseForm();
  else if(mode==='task') openTaskForm();
  else if(mode==='document') openDocumentForm();
  else if(mode==='communication') openCommForm();
}

/* ============== DRAWER / MODAL ============== */
function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); }
function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalOverlay').classList.add('open'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); document.getElementById('modalBody').innerHTML=''; }
function optionsHtml(arr, selected){
  return arr.map(v=>{
    const val = Array.isArray(v)?v[0]:v, lbl = Array.isArray(v)?v[1]:v;
    return `<option value="${esc(val)}" ${val===selected?'selected':''}>${esc(lbl)}</option>`;
  }).join('');
}

/* ============== DASHBOARD ============== */
function viewDashboard(){
  const openCases = DB.cases.filter(c=>c.status!=='CLOSED');
  const active = openCases.filter(c=>c.status==='ACTIVE').length;
  const awaitingClient = openCases.filter(c=>c.status==='AWAITING_CLIENT').length;
  const awaitingThird = openCases.filter(c=>c.status==='AWAITING_THIRD_PARTY').length;
  const newEnq = DB.enquiries.filter(e=>['NEW','CONTACTED','INFORMATION_GATHERING','ASSESSMENT_REQUIRED','ASSESSMENT_BOOKED'].includes(e.status)).length;
  const overdueTasks = DB.tasks.filter(t=>isOverdue(t.due,t.status));
  const dueTodayTasks = DB.tasks.filter(t=>t.due===todayStr() && !['COMPLETED','CANCELLED'].includes(t.status));

  const nextActions = openCases
    .filter(c=>c.nextActionDue)
    .sort((a,b)=>(a.nextActionDue||'9999').localeCompare(b.nextActionDue||'9999'))
    .slice(0,8);

  return `<div class="container">
    <div class="stat-grid">
      <a class="stat-card" href="#/cases"><div class="num">${DB.cases.length}</div><div class="lbl">Total Cases</div></a>
      <a class="stat-card" href="#/clients"><div class="num">${DB.clients.length}</div><div class="lbl">Total Clients</div></a>
      <a class="stat-card" href="#/cases?status=OPEN"><div class="num">${openCases.length}</div><div class="lbl">Open Cases</div></a>
      <a class="stat-card" href="#/enquiries?filter=open"><div class="num">${newEnq}</div><div class="lbl">New Enquiries</div></a>
      <a class="stat-card" href="#/cases?status=ACTIVE"><div class="num">${active}</div><div class="lbl">Active Casework</div></a>
      <a class="stat-card" href="#/cases?status=AWAITING"><div class="num">${awaitingClient+awaitingThird}</div><div class="lbl">Awaiting Response</div></a>
      <a class="stat-card alert" href="#/tasks?overdue=1"><div class="num">${overdueTasks.length}</div><div class="lbl">Overdue Tasks</div></a>
      <a class="stat-card" href="#/documents"><div class="num">${DB.documents.length}</div><div class="lbl">Documents Stored</div></a>
    </div>
    <p class="small" style="margin:-8px 0 14px;color:var(--grey)">A brand-new case shows here under <b>Total Cases</b> immediately, even before it has a status of "Active" — that only counts cases you've actually moved to Active Casework.</p>

    <div class="section-title"><h3>Cases Needing Attention</h3></div>
    ${nextActions.length? nextActions.map(c=>caseCardHtml(c)).join('') : '<div class="empty">No open next actions yet — add one from a case.</div>'}

    <hr>
    <div class="section-title"><h3>Due Today (${dueTodayTasks.length})</h3></div>
    ${dueTodayTasks.length? dueTodayTasks.map(t=>taskCardHtml(t)).join('') : '<div class="empty">Nothing due today.</div>'}

    <hr>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn btn-gold" href="#" onclick="openEnquiryForm();return false;">+ New Enquiry</a>
      <a class="btn btn-outline" href="#/cases">View All Cases</a>
    </div>
  </div>`;
}

function caseCardHtml(c){
  const st = statusMeta(CASE_STATUSES, c.status);
  const cl = clientById(c.clientId);
  const overdue = c.nextActionDue && c.nextActionDue < todayStr();
  return `<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/case/${c.id}">
    <div class="card-row">
      <div><div class="case-num">${esc(c.id)}</div><div class="case-sub">${esc(c.title||c.category||'')} ${cl?'· '+esc(cl.name):''}</div></div>
      <span class="pill pill-${st.color}">${esc(st.label)}</span>
    </div>
    ${c.nextAction? `<div class="next-action"><b>Next:</b> ${esc(c.nextAction)} ${c.nextActionDue? '&mdash; <span class="'+(overdue?'overdue-text':'')+'">'+fmtDate(c.nextActionDue)+(overdue?' (overdue)':'')+'</span>':''}</div>`:''}
  </a>`;
}
function taskCardHtml(t){
  const c = caseById(t.caseId);
  const overdue = isOverdue(t.due,t.status);
  return `<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/case/${t.caseId}">
    <div class="card-row">
      <div><b>${esc(t.description)}</b><div class="case-sub">${c?esc(c.id):''} ${c?'· '+esc(c.title||''):''}</div></div>
      <span class="pill ${overdue?'pill-red':'pill-navy'}">${overdue?'Overdue':fmtDate(t.due)}</span>
    </div>
  </a>`;
}

  return `<div class="container">
    <div class="section-title"><h2>Enquiries</h2><span class="small">${list.length}${filterLabel?' — '+esc(filterLabel):''}</span></div>

function doConvert(ev,enqId){
  ev.preventDefault();
  const f = new FormData(ev.target);
  const e = DB.enquiries.find(x=>x.id===enqId);
  let clientId = f.get('clientId');
  if(!clientId){
    const c = {id:uid('CL'), name:e.name, clientType:'Individual', phone:e.phone, whatsapp:e.phone, email:e.email,
      preferredContact:e.preferredContact, address:'', source:e.source||'Website', dateCreated:todayStr(), status:'Active', notes:''};
    DB.clients.push(c); clientId=c.id; saveKey('clients');
  }
  const num = nextCaseNumber();
  const cs = {
    id:num, clientId, enquiryId:enqId, category:f.get('category'), workType:'', title:f.get('title'),
    description:e.description, dateOpened:todayStr(), priority:'NORMAL', status:'INTAKE',
    nextAction:'Complete intake and confirm scope', nextActionDue:'', referralRequired:false, referralStatus:'',
    feeArrangement:'', dateClosed:'',
    assessment:{issue:'',facts:e.description||'',missingInfo:'',parties:e.institution||'',institution:e.institution||'',researchNotes:'',routes:'',recommendedNext:'',scope:'',limitations:'',referralRequired:'No',outcome:''},
    work:{objective:'',currentPosition:'',issues:'',workItems:[],workLog:[]},
    closure:{outcome:'',workCompleted:'',documentsDelivered:false,outstanding:'',referralMade:false,clientNotified:false,finalInvoice:false,closureDate:''}
  };
  DB.cases.push(cs); saveKey('cases');
  if(driveIsConnected()) driveCreateCaseFolder(cs.id).catch(()=>{});
  e.status='PROCEEDING'; e.clientId=clientId; e.convertedCaseId=num; saveKey('enquiries');
  DB.communications.push({id:uid('COM'),caseId:num,clientId,date:todayStr(),channel:'Website',direction:'Inbound',party:e.name,subject:'Enquiry received',summary:e.description||'Initial enquiry.',followUpDate:''});
  saveKey('communications');
  closeModal(); toast('Case '+num+' created'); location.hash='#/case/'+num;
}

/* ============== CASES ============== */
function viewCases(params){
  params = params || new URLSearchParams();
  let list = [...DB.cases];
  const statusFilter = params.get('status');
  let filterLabel = '';
  if(statusFilter==='ACTIVE'){ list = list.filter(c=>c.status==='ACTIVE'); filterLabel='Active Casework'; }
  else if(statusFilter==='AWAITING'){ list = list.filter(c=>c.status==='AWAITING_CLIENT'||c.status==='AWAITING_THIRD_PARTY'); filterLabel='Awaiting a Response'; }
  else if(statusFilter==='OPEN'){ list = list.filter(c=>c.status!=='CLOSED'); filterLabel='Open (not yet closed)'; }
  list.sort((a,b)=> (a.status==='CLOSED')-(b.status==='CLOSED') || (a.nextActionDue||'9999').localeCompare(b.nextActionDue||'9999'));
  return `<div class="container">
    <div class="section-title"><h2>Cases</h2><span class="small">${list.length}${filterLabel?' — '+esc(filterLabel):''}</span></div>
    ${filterLabel?`<p class="small"><a href="#/cases">Clear filter</a></p>`:''}
    ${list.length? list.map(caseCardHtml).join('') : '<div class="empty">No cases match this view.</div>'}
  </div>`;
}

    DB.clients.push(nc); saveKey('clients'); clientId = nc.id;
  }
  const num = nextCaseNumber();
  const cs = {id:num,clientId,enquiryId:null,category:f.get('category'),workType:'',title:f.get('title'),

    assessment:{issue:'',facts:'',missingInfo:'',parties:'',institution:'',researchNotes:'',routes:'',recommendedNext:'',scope:'',limitations:'',referralRequired:'No',outcome:''},
    work:{objective:'',currentPosition:'',issues:'',workItems:[],workLog:[]},
    closure:{outcome:'',workCompleted:'',documentsDelivered:false,outstanding:'',referralMade:false,clientNotified:false,finalInvoice:false,closureDate:''}};
  DB.cases.push(cs); saveKey('cases');
  if(driveIsConnected()) driveCreateCaseFolder(cs.id).catch(()=>{});
  closeModal(); toast('Case '+num+' created'); location.hash='#/case/'+num;
}

function viewCaseDetail(id, tab){
  const c = caseById(id);
  if(!c) return '<div class="container empty">Case not found.</div>';
  if(!c.work) c.work = {objective:'',currentPosition:'',issues:'',workItems:[],workLog:[]};
  if(c.workType===undefined) c.workType='';
  tab = tab || (window.__caseTab && window.__caseTab[id]) || 'overview';
  const cl = clientById(c.clientId);
  const st = statusMeta(CASE_STATUSES,c.status);
  const tabs = ['overview','assessment','work','tasks','documents','drafts','communications','closure'];

    `;
  } else if(tab==='assessment'){
    const a = c.assessment;
    body = `<form onsubmit="return saveAssessment(event,'${id}')">
      <label>What is the issue?</label><textarea name="issue" rows="2">${esc(a.issue)}</textarea>
      <label>Facts established</label><textarea name="facts" rows="2">${esc(a.facts)}</textarea>
      <label>Missing information</label><textarea name="missingInfo" rows="2">${esc(a.missingInfo)}</textarea>
      <label>Relevant parties</label><input name="parties" value="${esc(a.parties)}">
      <label>Relevant institution</label><input name="institution" value="${esc(a.institution)}">
      <label>Research notes</label><textarea name="researchNotes" rows="2">${esc(a.researchNotes)}</textarea>
      <label>Possible routes</label><textarea name="routes" rows="2">${esc(a.routes)}</textarea>
      <label>Recommended next step</label><textarea name="recommendedNext" rows="2">${esc(a.recommendedNext)}</textarea>
      <label>Scope of TMI work</label><textarea name="scope" rows="2">${esc(a.scope)}</textarea>
      <label>Limitations</label><textarea name="limitations" rows="2">${esc(a.limitations)}</textarea>
      <label>Referral required?</label><select name="referralRequired"><option ${a.referralRequired==='No'?'selected':''}>No</option><option ${a.referralRequired==='Yes'?'selected':''}>Yes</option></select>
      <label>Assessment outcome</label><select name="outcome">${optionsHtml(ASSESS_OUTCOMES,a.outcome)}</select>
      <button class="btn btn-primary btn-block" type="submit">Save Assessment</button>
    </form>`;
  } else if(tab==='work'){
    const w = c.work;
    const doneCount = w.workItems.filter(i=>i.done).length;
    body = `
      <label>Current Objective</label>
      <textarea rows="2" onchange="updateCaseWorkField('${id}','objective',this.value)" placeholder="What are we trying to achieve?">${esc(w.objective)}</textarea>
      <label>Current Position</label>
      <textarea rows="2" onchange="updateCaseWorkField('${id}','currentPosition',this.value)" placeholder="Where does the matter stand right now?">${esc(w.currentPosition)}</textarea>
      <label>Key Issues</label>
      <textarea rows="2" onchange="updateCaseWorkField('${id}','issues',this.value)" placeholder="What problems have been identified?">${esc(w.issues)}</textarea>

      ${w.workItems.length? w.workItems.map(it=>`

        const realIdx = w.workLog.indexOf(l);
        return `<div class="timeline-item"><div class="timeline-date">${new Date(l.date).toLocaleString('en-ZA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
          <button class="btn btn-danger btn-sm" style="padding:2px 8px;margin-left:8px" onclick="deleteWorkLog('${id}',${realIdx})">✕</button></div>${esc(l.text)}</div>`;

  } else if(tab==='tasks'){
    const ts = tasksForCase(id);
    body = `<button class="btn btn-gold btn-sm" onclick="openTaskForm('${id}')">+ New Task</button><div style="height:10px"></div>
      ${ts.length? ts.map(t=>{
        const ov = isOverdue(t.due,t.status);
        return `<div class="card">
          <div class="card-row"><b>${esc(t.description)}</b><span class="pill ${ov?'pill-red':'pill-grey'}">${esc(TASK_STATUSES.find(x=>x[0]===t.status)?.[1]||t.status)}</span></div>
          <div class="case-sub">Due ${t.due?fmtDate(t.due):'—'} ${ov?' (overdue)':''} · Priority ${esc(t.priority)}</div>
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
            <select onchange="updateTaskStatus('${t.id}',this.value)">${optionsHtml(TASK_STATUSES,t.status)}</select>
            <button class="btn btn-danger btn-sm" onclick="deleteTaskRecord('${t.id}')">Delete</button>
          </div>
        </div>`;
      }).join('') : '<div class="empty">No tasks yet.</div>'}`;
  } else if(tab==='documents'){
    const ds = docsForCase(id);
    body = `${driveCaseFolderBannerHtml(c)}
      <button class="btn btn-gold btn-sm" onclick="openDocumentForm('${id}')">+ Add Document</button><div style="height:10px"></div>
      ${ds.length? ds.map(d=>`<div class="card">
          <div class="card-row"><b>${esc(d.name)}</b><span class="pill pill-navy">${esc(d.status)}</span></div>
          <div class="case-sub">${esc(d.type)} · received ${d.dateReceived?fmtDate(d.dateReceived):'—'}</div>
          ${d.fileId?`<div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline btn-sm" onclick="openStoredFile('${d.fileId}')">Open</button><span class="small">${esc(d.fileName||'')} ${d.fileSize?'('+Math.round(d.fileSize/1024)+' KB)':''}</span></div>`:''}
          ${driveDocButtonHtml(c,d)}
          ${d.link?`<div class="linkline small"><a href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.link)}</a></div>`:''}
          ${d.notes?`<div class="small">${esc(d.notes)}</div>`:''}
          <button class="btn btn-danger btn-sm" style="margin-top:8px" onclick="deleteDocument('${d.id}')">Delete</button>
        </div>`).join('') : '<div class="empty">No documents yet. Upload a file from your phone, or log a link to where it is kept.</div>'}
      <p class="small" style="margin-top:10px">Uploaded files are stored on this device (this browser) first. Connect Google Drive in Settings to also push copies to your client's Drive folder.</p>`;
  } else if(tab==='drafts'){
    const ds = DB.drafts.filter(x=>x.caseId===id).sort((a,b)=>(b.updated||b.created||'').localeCompare(a.updated||a.created||''));
    body = `<p class="small">Type and save correspondence and work product directly here — letters, complaints, statements, chronologies, case notes, research notes, or a blank document to type freely. Not dependent on uploading anything. Keep editing over time, mark Final when done, then export to PDF or Word.</p>
      <button class="btn btn-gold btn-sm" onclick="openDraftPicker('${id}')">+ New Document</button><div style="height:10px"></div>
      ${ds.length? ds.map(d=>{
        const t = TEMPLATES[d.templateKey];
        return `<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/draft/${d.id}">
          <div class="card-row"><b>${esc(d.title||t.label)}</b><span class="pill ${d.status==='final'?'pill-green':'pill-grey'}">${d.status==='final'?'Final':'Draft'}</span></div>
          <div class="case-sub">${esc(t.label)} · updated ${d.updated?fmtDate(d.updated):fmtDate(d.created)}</div>
        </a>`;
      }).join('') : '<div class="empty">No documents drafted yet for this case.</div>'}`;
  } else if(tab==='communications'){
    const cs = commsForCase(id);
    body = `<button class="btn btn-gold btn-sm" onclick="openCommForm('${id}')">+ Log Communication</button><div style="height:10px"></div>
      ${cs.length? cs.map(m=>`<div class="card">
          <div class="card-row"><b>${esc(m.channel)} — ${esc(m.direction)}</b><span class="small">${fmtDate(m.date)}</span></div>
          <div class="case-sub">${esc(m.party||'')} ${m.subject?'· '+esc(m.subject):''}</div>
          <div class="small">${esc(m.summary)}</div>
          ${m.followUpTaskId?`<div class="small" style="color:var(--amber)">⏰ Follow-up task due ${fmtDate(m.followUpDate)}</div>`:(m.followUpDate?`<div class="small">Follow-up: ${fmtDate(m.followUpDate)}</div>`:'')}
          <button class="btn btn-danger btn-sm" style="margin-top:6px" onclick="deleteComm('${m.id}')">Delete</button>
        </div>`).join('') : '<div class="empty">No communications logged yet.</div>'}`;
  } else if(tab==='closure'){
    const cz = c.closure;
    body = `<form onsubmit="return saveClosure(event,'${id}')">
      <label>Outcome</label><textarea name="outcome" rows="2">${esc(cz.outcome)}</textarea>
      <label>Work completed</label><textarea name="workCompleted" rows="2">${esc(cz.workCompleted)}</textarea>
      <label><input type="checkbox" name="documentsDelivered" ${cz.documentsDelivered?'checked':''} style="width:auto;display:inline-block;margin-right:6px"> Documents delivered</label>
      <label>Outstanding matters</label><textarea name="outstanding" rows="2">${esc(cz.outstanding)}</textarea>
      <label><input type="checkbox" name="referralMade" ${cz.referralMade?'checked':''} style="width:auto;display:inline-block;margin-right:6px"> Referral made</label>
      <label><input type="checkbox" name="clientNotified" ${cz.clientNotified?'checked':''} style="width:auto;display:inline-block;margin-right:6px"> Client notified</label>
      <label><input type="checkbox" name="finalInvoice" ${cz.finalInvoice?'checked':''} style="width:auto;display:inline-block;margin-right:6px"> Final invoice issued</label>
      <label>Closure date</label><input type="date" name="closureDate" value="${cz.closureDate||''}">
      <button class="btn btn-primary btn-block" type="submit">Save Closure</button>
      <button type="button" class="btn btn-danger btn-block" onclick="closeCaseNow('${id}')">Mark Case CLOSED</button>
    </form>`;
  }

  return `<div class="container">
    <a href="#/cases" class="small">&larr; Cases</a>
    <div class="section-title" style="margin-top:6px">
      <div><div class="case-num" style="font-size:19px">${esc(c.id)}</div><div class="case-sub">${esc(c.title)}</div></div>
      <span class="pill pill-${st.color}">${esc(st.label)}</span>
    </div>
    <div class="tabbar">
      ${tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="gotoCaseTab('${id}','${t}')">${t==='drafts'?'Correspondence':(t.charAt(0).toUpperCase()+t.slice(1))}</button>`).join('')}
    </div>
    ${body}
    <hr>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn btn-outline btn-sm" href="#/casereport/${id}">Generate Full Case Report</a>
      <a class="btn btn-outline btn-sm" href="#/manual">Operating Manual</a>
      <button class="btn btn-danger btn-sm" onclick="deleteCase('${id}')">Delete Case</button>
    </div>
  </div>`;
}
function gotoCaseTab(id,tab){ window.__caseTab = window.__caseTab||{}; window.__caseTab[id]=tab; document.getElementById('app').innerHTML = viewCaseDetail(id,tab); window.scrollTo(0,0); }
function updateCaseField(id,field,val){ const c=caseById(id); c[field]=val; saveKey('cases'); if(field==='status'){ document.getElementById('app').innerHTML=viewCaseDetail(id,'overview'); } toast('Saved'); }
function updateCaseCategory(id,val){ const c=caseById(id); c.category=val; c.workType=''; saveKey('cases'); document.getElementById('app').innerHTML=viewCaseDetail(id,'overview'); toast('Saved'); }
function updateCaseWorkField(id,field,val){ const c=caseById(id); c.work[field]=val; saveKey('cases'); toast('Saved'); }
function loadChecklistTemplate(id){
  const c = caseById(id); const items = CHECKLIST_TEMPLATES[c.workType];
  if(!items){ toast('No standard checklist for this work type yet'); return; }
  const existingText = new Set(c.work.workItems.map(i=>i.text));
  items.forEach(t=>{ if(!existingText.has(t)) c.work.workItems.push({id:uid('WI'),text:t,done:false}); });
  saveKey('cases'); gotoCaseTab(id,'work'); toast('Checklist loaded');
}
function addWorkItem(id,text){
  if(!text||!text.trim()) return;
  const c = caseById(id); c.work.workItems.push({id:uid('WI'),text:text.trim(),done:false});
  saveKey('cases'); gotoCaseTab(id,'work');
}
function toggleWorkItem(id,itemId){
  const c = caseById(id); const it = c.work.workItems.find(x=>x.id===itemId); it.done=!it.done;
  saveKey('cases'); gotoCaseTab(id,'work');
}
function deleteWorkItem(id,itemId){
  const c = caseById(id); c.work.workItems = c.work.workItems.filter(x=>x.id!==itemId);
  saveKey('cases'); gotoCaseTab(id,'work');
}
function addWorkLog(id,text){
  if(!text||!text.trim()) return;
  const c = caseById(id); c.work.workLog.push({date:new Date().toISOString(),text:text.trim()});
  saveKey('cases'); gotoCaseTab(id,'work');
}
function deleteWorkLog(id,idx){
  const c = caseById(id); c.work.workLog.splice(idx,1);
  saveKey('cases'); gotoCaseTab(id,'work');
}
function timelineHtml(c){
  const events = [];
  events.push({date:c.dateOpened, label:'Case opened'});
  commsForCase(c.id).forEach(m=>events.push({date:m.date, label:m.channel+' ('+m.direction+'): '+(m.subject||m.summary.slice(0,40))}));
  tasksForCase(c.id).filter(t=>t.status==='COMPLETED').forEach(t=>events.push({date:t.due||c.dateOpened, label:'Task completed: '+t.description}));
  if(c.dateClosed) events.push({date:c.dateClosed, label:'Case closed'});
  events.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!events.length) return '<div class="empty">No events yet.</div>';
  return events.map(e=>`<div class="timeline-item"><div class="timeline-date">${fmtDate(e.date)}</div>${esc(e.label)}</div>`).join('');
}
function saveAssessment(ev,id){
  ev.preventDefault(); const f=new FormData(ev.target); const c=caseById(id);
  c.assessment = {issue:f.get('issue'),facts:f.get('facts'),missingInfo:f.get('missingInfo'),parties:f.get('parties'),
    institution:f.get('institution'),researchNotes:f.get('researchNotes'),routes:f.get('routes'),
    recommendedNext:f.get('recommendedNext'),scope:f.get('scope'),limitations:f.get('limitations'),
    referralRequired:f.get('referralRequired'),outcome:f.get('outcome')};
  saveKey('cases'); toast('Assessment saved'); gotoCaseTab(id,'assessment');
}
function saveClosure(ev,id){
  ev.preventDefault(); const f=new FormData(ev.target); const c=caseById(id);
  c.closure = {outcome:f.get('outcome'),workCompleted:f.get('workCompleted'),documentsDelivered:!!f.get('documentsDelivered'),
    outstanding:f.get('outstanding'),referralMade:!!f.get('referralMade'),clientNotified:!!f.get('clientNotified'),
    finalInvoice:!!f.get('finalInvoice'),closureDate:f.get('closureDate')};
  saveKey('cases'); toast('Closure saved'); gotoCaseTab(id,'closure');
}
function closeCaseNow(id){
  const c=caseById(id); c.status='CLOSED'; c.dateClosed = c.closure.closureDate || todayStr(); saveKey('cases');
  toast('Case closed'); location.hash='#/cases';
}

/* ============== DRAFT DOCUMENTS ============== */
function openDraftPicker(caseId){
  const opts = Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${esc(t.label)}</option>`).join('');
  openModal(`<button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>New Document</h2>
    <form onsubmit="return createDraft(event,'${caseId}')">
      <label>Template</label><select name="templateKey">${opts}</select>
      <label>Document Title (optional)</label><input name="title" placeholder="Leave blank to use template name">
      <button class="btn btn-primary btn-block" type="submit">Start Drafting</button>
    </form>`);
}
function createDraft(ev,caseId){
  ev.preventDefault(); const f=new FormData(ev.target);
  const key = f.get('templateKey'); const t = TEMPLATES[key]; const c = caseById(caseId);
  const values = {docDate: todayStr()};
  t.fields.forEach(fld=>{ values[fld.name] = typeof fld.default==='function' ? (fld.default(c)||'') : (fld.default||''); });
  const d = {id:uid('DRAFT'), caseId, templateKey:key, title:f.get('title')||t.label, values, status:'draft', created:todayStr(), updated:todayStr()};
  DB.drafts.push(d); saveKey('drafts'); closeModal(); toast('Draft started'); location.hash='#/draft/'+d.id;
}
function viewDraftEditor(id){
  const d = DB.drafts.find(x=>x.id===id);
  if(!d) return '<div class="container empty">Document not found.</div>';
  const c = caseById(d.caseId); const cl = clientById(c.clientId);
  const t = TEMPLATES[d.templateKey];
  const fieldsHtml = t.fields.map(f=>{
    if(d.values[f.name]===undefined) d.values[f.name] = typeof f.default==='function'?(f.default(c)||''):(f.default||'');
    const val = d.values[f.name];
    return f.type==='textarea'
      ? `<label>${esc(f.label)}</label><textarea rows="3" oninput="updateDraftField('${id}','${f.name}',this.value)">${esc(val)}</textarea>`
      : `<label>${esc(f.label)}</label><input value="${esc(val)}" oninput="updateDraftField('${id}','${f.name}',this.value)">`;
  }).join('');
  return `<div class="container">
    <a href="#/case/${c.id}" class="small">&larr; Back to ${esc(c.id)}</a>
    <div class="section-title" style="margin-top:6px"><h2>${esc(t.label)}</h2><span class="pill ${d.status==='final'?'pill-green':'pill-grey'}">${d.status==='final'?'Final':'Draft'}</span></div>
    <p class="small">${esc(c.id)} — ${esc(c.title)} ${cl?'· '+esc(cl.name):''}</p>
    <label>Document Title</label>
    <input value="${esc(d.title)}" oninput="updateDraftTitle('${id}',this.value)">
    <label>Document Date</label>
    <input type="date" value="${d.values.docDate||todayStr()}" oninput="updateDraftField('${id}','docDate',this.value)">
    ${fieldsHtml}
    <button class="btn btn-primary btn-block" onclick="saveDraft('${id}')">Save Draft</button>
    <hr>
    <h3>Preview</h3>
    <div id="draftPreview" style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-wrap;font-size:13.5px;max-height:320px;overflow-y:auto">${esc(fullDocText(d,c,cl))}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <button class="btn btn-gold" onclick="exportDraftPdf('${id}')">Print / Save as PDF</button>
      <button class="btn btn-outline" onclick="exportDraftWord('${id}')">Download as Word (.doc)</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="btn btn-outline btn-sm" onclick="toggleDraftFinal('${id}')">${d.status==='final'?'Reopen as Draft':'Mark as Final'}</button>
      <button class="btn btn-danger btn-sm" onclick="deleteDraft('${id}')">Delete</button>
    </div>
    <p class="small" style="margin-top:10px">Last saved: ${d.updated?fmtDate(d.updated):'not yet'}. Tap <b>Save Draft</b> before leaving so edits aren't lost — you can reopen and continue any time.</p>
  </div>`;
}
function updateDraftField(id,name,value){
  const d = DB.drafts.find(x=>x.id===id); d.values[name]=value;
  const c = caseById(d.caseId), cl = clientById(c.clientId);
  const pv = document.getElementById('draftPreview'); if(pv) pv.textContent = fullDocText(d,c,cl);
}
function updateDraftTitle(id,val){ const d=DB.drafts.find(x=>x.id===id); d.title=val; }
function saveDraft(id){ const d=DB.drafts.find(x=>x.id===id); d.updated=todayStr(); saveKey('drafts'); toast('Draft saved'); route(); }
function toggleDraftFinal(id){ const d=DB.drafts.find(x=>x.id===id); d.status = d.status==='final'?'draft':'final'; d.updated=todayStr(); saveKey('drafts'); route(); toast(d.status==='final'?'Marked final':'Reopened as draft'); }
function deleteDraft(id){
  const d = DB.drafts.find(x=>x.id===id); if(!d) return;
  if(!confirm('Delete this document? This cannot be undone.')) return;
  const caseId = d.caseId;
  DB.drafts = DB.drafts.filter(x=>x.id!==id); saveKey('drafts'); toast('Deleted');
  gotoCaseTab(caseId,'drafts');
}
function exportDraftPdf(id){
  const d = DB.drafts.find(x=>x.id===id); const c=caseById(d.caseId); const cl=clientById(c.clientId);
  const text = fullDocText(d,c,cl);

/* ============== OPERATING MANUAL (T01–T16) ==============
   Sixteen fixed, standalone procedure slots. Each can hold typed text
   and/or one attached reference file. Each is independently viewable,
   printable and exportable — not dependent on any case or upload. */
function viewManual(){
  ensureManual();
  return `<div class="container">
    <div class="section-title"><h2>TMI Operating Manual</h2><span class="small">T01–T16</span></div>
    <p class="small">TMI's internal standard operating procedures. Each is its own standalone, printable document — available offline, independent of any case.</p>
    <div class="card" style="background:var(--cream)">
      <h3 style="margin-top:0">Upload your existing T01–T16 files</h3>
      <p class="small">Already have the manual as Word/PDF files? Select them all at once — files named with their code (e.g. "T04 Assessment.docx") are matched automatically; anything else fills the next empty slot in order.</p>
      <input type="file" id="bulkManualInput" multiple accept=".pdf,.doc,.docx,.txt,.rtf">
      <button class="btn btn-gold btn-sm" style="margin-top:8px" onclick="bulkUploadManualFiles()">Upload &amp; Auto-Assign</button>
    </div>
    ${MANUAL_CODES.map(code=>{
      const m = manualByCode(code);
      const has = (m.title||m.body||m.fileId);
      return `<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/manualitem/${code}">
        <div class="card-row"><b>${code}${m.title?' — '+esc(m.title):''}</b><span class="pill ${has?'pill-navy':'pill-grey'}">${has?'Set':'Empty'}</span></div>
        ${m.fileName?`<div class="case-sub">File: ${esc(m.fileName)}</div>`:''}
        ${m.body?`<div class="case-sub">${esc(m.body.slice(0,90))}${m.body.length>90?'…':''}</div>`:''}
      </a>`;
    }).join('')}
  </div>`;
}
async function bulkUploadManualFiles(){
  const input = document.getElementById('bulkManualInput');
  const files = Array.from(input.files||[]);
  if(!files.length){ toast('Choose one or more files first'); return; }
  ensureManual();
  let usedCodes = new Set();
  const codeRe = /T\s?0?(\d{1,2})\b/i;
  // First pass: match by filename
  for(const file of files){
    const m = file.name.match(codeRe);
    if(m){
      const num = parseInt(m[1],10);
      if(num>=1 && num<=16){
        const code = 'T'+String(num).padStart(2,'0');
        if(!usedCodes.has(code)){ await assignManualFile(code, file); usedCodes.add(code); file.__assigned = true; }
      }
    }
  }
  // Second pass: unmatched files fill next empty slot in order
  const remaining = files.filter(f=>!f.__assigned);
  for(const file of remaining){
    const nextCode = MANUAL_CODES.find(c=>!usedCodes.has(c) && !manualByCode(c).fileId);
    if(!nextCode){ toast('All 16 slots are already filled — remove a file first to replace it'); break; }
    await assignManualFile(nextCode, file); usedCodes.add(nextCode);
  }
  saveKey('manual'); toast(usedCodes.size+' file(s) assigned'); document.getElementById('app').innerHTML = viewManual();
}
async function assignManualFile(code, file){
  const m = manualByCode(code);
  const fileId = uid('MFILE');
  try{
    await idbPut({id:fileId, blob:file, filename:file.name, mimeType:file.type, size:file.size});
    if(m.fileId){ try{ await idbDelete(m.fileId); }catch(e){} }
    m.fileId=fileId; m.fileName=file.name; m.fileType=file.type; m.updated=todayStr();
    if(!m.title){ m.title = file.name.replace(/\.[^.]+$/,'').replace(codeRefTitle,'').trim(); }
  }catch(e){ toast('Could not store '+file.name); }
}
const codeRefTitle = /T\s?0?\d{1,2}\b[\s\-_.]*/i;
function viewManualItem(code){
  const m = manualByCode(code);
  if(!m) return '<div class="container empty">Procedure not found.</div>';
  return `<div class="container">
    <a href="#/manual" class="small">&larr; Operating Manual</a>
    <div class="section-title" style="margin-top:6px"><h2>${code}</h2></div>
    <label>Procedure Title</label>

    <label>Procedure Text</label>
    <textarea id="manBody" rows="14" placeholder="Type or paste the full standalone procedure here…" oninput="updateManualField('${code}','body',this.value)">${esc(m.body)}</textarea>
    <label>Attached reference file (optional)</label>

    ${m.fileId?`<div class="small" style="margin-top:6px">Attached: ${esc(m.fileName||'file')} — <a href="#" onclick="openStoredFile('${m.fileId}');return false;">Open</a> · <a href="#" onclick="removeManualFile('${code}');return false;">Remove</a></div>`:''}
    <p class="small" style="margin-top:10px">Saves automatically as you type. ${m.updated?('Last saved '+fmtDate(m.updated)):''}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">

function buildCaseReport(id){
  const c = caseById(id), cl = clientById(c.clientId);
  const f = document.getElementById('reportForm');
  const checked = name => { const el = f.querySelector(`[name="${name}"]`); return el && el.checked; };
  const a = c.assessment||{}, w = c.work||{objective:'',currentPosition:'',issues:'',workLog:[]}, cz = c.closure||{};

  const events = [];
  events.push({date:c.dateOpened, label:'Case opened'});
  commsForCase(id).forEach(m=>events.push({key:'comm_'+m.id, date:m.date, label:m.channel+' ('+m.direction+') with '+(m.party||'—')+(m.subject?': '+m.subject:'')}));
  tasksForCase(id).filter(t=>t.status==='COMPLETED').forEach(t=>events.push({key:'task_'+t.id, date:t.due||c.dateOpened, label:'Task completed: '+t.description}));
  if(c.dateClosed) events.push({date:c.dateClosed, label:'Case closed'});
  events.sort((x,y)=>(x.date||'').localeCompare(y.date||''));
  const evLines = events.map((e,i)=> checked('ev_'+i) ? fmtDate(e.date)+' — '+e.label : null).filter(Boolean);

  const corr = DB.drafts.filter(d=>d.caseId===id && d.status==='final').filter(d=>checked('corr_'+d.id));
  const docs = docsForCase(id).filter(d=>checked('doc_'+d.id));
  const comms = commsForCase(id).filter(m=>checked('comm_'+m.id));
  const tasksSel = tasksForCase(id).filter(t=>checked('task_'+t.id));

  const sections = [];
  sections.push(['1. EXECUTIVE SUMMARY', `Case ${c.id} — ${c.title}\nClient: ${cl?cl.name:'—'}\nStatus: ${statusMeta(CASE_STATUSES,c.status).label}\nOpened: ${fmtDate(c.dateOpened)}${c.dateClosed?('\nClosed: '+fmtDate(c.dateClosed)):''}`]);
  sections.push(['2. CLIENT & MATTER DETAILS', `Client: ${cl?cl.name:'—'}\nContact: ${cl?(cl.phone||cl.email||'—'):'—'}\nMatter: ${c.title}\nCategory: ${c.category||'—'}${c.workType?(' / '+c.workType):''}\nDescription: ${c.description||'—'}`]);
  sections.push(['3. BACKGROUND', c.description||'—']);
  sections.push(['4. CHRONOLOGY OF EVENTS', evLines.length?evLines.join('\n'):'—']);
  sections.push(['5. ASSESSMENT & ISSUES IDENTIFIED', [['Issue',a.issue],['Facts established',a.facts],['Missing information',a.missingInfo],['Key issues (work)',w.issues]].map(([k,v])=>k+': '+(v||'—')).join('\n')]);
  sections.push(['6. RESEARCH & FINDINGS', a.researchNotes||'—']);
  sections.push(['7. ACTIONS TAKEN', (w.workLog&&w.workLog.length)? w.workLog.map(l=>new Date(l.date).toLocaleDateString('en-ZA')+' — '+l.text).join('\n') : '—']);
  sections.push(['8. CORRESPONDENCE', corr.length? corr.map(d=>'• '+d.title+' ('+(TEMPLATES[d.templateKey]?.label||'')+')').join('\n') : '—']);
  sections.push(['9. COMMUNICATIONS', comms.length? comms.map(m=>fmtDate(m.date)+' — '+m.channel+' ('+m.direction+') with '+(m.party||'—')+': '+(m.summary||'')).join('\n') : '—']);
  sections.push(['10. DOCUMENTS', docs.length? docs.map(d=>'• '+d.name+' ('+d.type+')'+(d.fileName?' — file: '+d.fileName:'')).join('\n') : '—']);
  sections.push(['11. TASKS', tasksSel.length? tasksSel.map(t=>'• '+t.description+' — '+(TASK_STATUSES.find(x=>x[0]===t.status)?.[1]||t.status)+(t.due?(' (due '+fmtDate(t.due)+')'):'')).join('\n') : '—']);
  sections.push(['12. OUTSTANDING MATTERS', cz.outstanding||'—']);
  sections.push(['13. OUTCOME / RESOLUTION', cz.outcome||'—']);
  sections.push(['14. NEXT STEPS', c.nextAction? (c.nextAction+(c.nextActionDue?' (due '+fmtDate(c.nextActionDue)+')':'')) : '—']);
  sections.push(['15. SUPPORTING DOCUMENTS INDEX', docs.length? docs.map((d,i)=>(i+1)+'. '+d.name+' — '+d.type).join('\n') : 'None indexed.']);

  const text = `TMI — CASE REPORT\n${c.id} — ${c.title}\nClient: ${cl?cl.name:'—'}\nDate prepared: ${fmtDate(todayStr())}\n\n`
    + sections.map(([h,b])=>h+'\n'+'-'.repeat(Math.min(h.length,40))+'\n'+b).join('\n\n');

  const wrap = document.getElementById('reportPreviewWrap');
  wrap.innerHTML = `<hr><h3>Report Preview (editable)</h3>
    <textarea id="reportText" rows="20" style="font-family:Georgia,serif;font-size:13px">${esc(text)}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="btn btn-gold" onclick="printCaseReport('${id}')">Print / Save as PDF</button>
      <button class="btn btn-outline" onclick="exportCaseReportWord('${id}')">Download as Word (.doc)</button>
    </div>
    <p class="small" style="margin-top:8px">Edit the text above before exporting if needed — sections are a starting point, not a locked template.</p>`;
  wrap.scrollIntoView({behavior:'smooth'});
}

/* ============== GOOGLE DRIVE (OPTIONAL) ==============
   Off by default. Nothing here runs, and no Google script is loaded,
   until the user pastes their own free Google OAuth Client ID into
   Settings and taps Connect. Uses the 'drive.file' scope only — this
   app can only see/create files it made itself, never your whole Drive.
   The access token lives in memory only (never saved to disk), so you
   reconnect each time you reopen the Hub — deliberately, for safety. */
const DRIVE_SUBFOLDERS = DOC_TYPES; // one Drive subfolder per document type, same names
let driveToken = null, driveTokenExpiry = 0, driveTokenClient = null, driveUserEmail = '';
function driveIsConnected(){ return !!(driveToken && Date.now() < driveTokenExpiry); }
function loadGisScript(){
  return new Promise((resolve,reject)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('Could not load Google sign-in script — check your internet connection.'));
    document.head.appendChild(s);
  });
}
async function driveConnect(){
  const idInput = document.getElementById('driveClientId');
  const clientId = (idInput ? idInput.value.trim() : (DB.settings.driveClientId||''));
  if(!clientId){ toast('Paste your Google OAuth Client ID first'); return; }
  DB.settings.driveClientId = clientId; saveKey('settings');
  try{
    toast('Connecting to Google...');
    await loadGisScript();
    await new Promise((resolve,reject)=>{
      driveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
        callback: async (resp)=>{
          if(resp.error){ reject(new Error(resp.error)); return; }
          driveToken = resp.access_token; driveTokenExpiry = Date.now() + (Number(resp.expires_in||3600)-60)*1000;
          try{
            const me = await driveApiFetch('https://www.googleapis.com/oauth2/v2/userinfo');
            driveUserEmail = me.email || '';
          }catch(e){ driveUserEmail=''; }
          await driveEnsureRoot();
          resolve();
        }
      });
      driveTokenClient.requestAccessToken({prompt: driveToken ? '' : 'consent'});
    });
    toast('Google Drive connected'); route();
  }catch(e){ toast('Could not connect: '+e.message); }
}
function driveDisconnect(){
  if(driveToken && window.google) { try{ google.accounts.oauth2.revoke(driveToken, ()=>{}); }catch(e){} }
  driveToken=null; driveTokenExpiry=0; driveUserEmail=''; toast('Disconnected'); route();
}
async function driveApiFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, {Authorization: 'Bearer '+driveToken});
  const res = await fetch(url, opts);
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error('Drive API error '+res.status+' '+t.slice(0,200)); }
  return res.json();
}
async function driveFindOrCreateFolder(name, parentId){
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false` + (parentId?` and '${parentId}' in parents`:''));
  const found = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  if(found.files && found.files.length) return found.files[0].id;
  const meta = {name, mimeType:'application/vnd.google-apps.folder'};
  if(parentId) meta.parents=[parentId];
  const created = await driveApiFetch('https://www.googleapis.com/drive/v3/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(meta)});
  return created.id;
}
async function driveEnsureRoot(){
  if(DB.settings.driveRootFolderId) return DB.settings.driveRootFolderId;
  const id = await driveFindOrCreateFolder('TMI Clients', null);
  DB.settings.driveRootFolderId = id; saveKey('settings');
  return id;
}
async function driveCreateCaseFolder(caseId){
  if(!driveIsConnected()) throw new Error('Not connected');
  const c = caseById(caseId); if(!c) return;
  if(c.driveFolderId) return c.driveFolderId;
  const root = await driveEnsureRoot();
  const cl = clientById(c.clientId);
  const folderName = c.id + (cl?(' - '+cl.name):'');
  const folderId = await driveFindOrCreateFolder(folderName, root);
  c.driveFolderId = folderId; c.driveSubfolders = c.driveSubfolders || {};
  for(const type of DRIVE_SUBFOLDERS){
    if(!c.driveSubfolders[type]){
      c.driveSubfolders[type] = await driveFindOrCreateFolder(type, folderId);
    }
  }
  saveKey('cases'); toast('Drive folder ready for '+c.id);
  return folderId;
}
function driveCaseFolderBannerHtml(c){
  if(!driveIsConnected()) return '';
  if(c.driveFolderId){
    return `<div class="card" style="background:var(--cream);display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div class="small">📁 This case has a Google Drive folder.</div>
      <a class="btn btn-outline btn-sm" href="https://drive.google.com/drive/folders/${esc(c.driveFolderId)}" target="_blank" rel="noopener">Open in Drive</a>
    </div>`;
  }
  return `<div class="card" style="background:var(--cream);display:flex;justify-content:space-between;align-items:center;gap:8px">
    <div class="small">No Drive folder for this case yet.</div>
    <button class="btn btn-outline btn-sm" onclick="driveCreateCaseFolder('${c.id}').then(route).catch(e=>toast(e.message))">Create Drive folder</button>
  </div>`;
}
function driveDocButtonHtml(c,d){
  if(!driveIsConnected() || !d.fileId) return '';
  if(d.driveFileId){
    return `<div class="small" style="margin-top:4px"><a href="${esc(d.driveLink||('https://drive.google.com/file/d/'+d.driveFileId+'/view'))}" target="_blank" rel="noopener">✓ In Google Drive — open</a></div>`;
  }
  return `<div style="margin-top:6px"><button class="btn btn-outline btn-sm" onclick="driveUploadDocument('${d.id}')">Upload copy to Drive</button></div>`;
}
async function driveUploadDocument(docId){
  const d = DB.documents.find(x=>x.id===docId); if(!d || !d.fileId) return;
  const c = caseById(d.caseId); if(!c) return;
  try{
    toast('Uploading to Drive...');
    if(!c.driveFolderId) await driveCreateCaseFolder(c.id);
    const rec = await idbGet(d.fileId); if(!rec || !rec.blob) throw new Error('File not found on this device');
    const parentId = (c.driveSubfolders && c.driveSubfolders[d.type]) || c.driveFolderId;
    const meta = {name: d.fileName || d.name, parents:[parentId]};
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(meta)], {type:'application/json'}));
    form.append('file', rec.blob);
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
      method:'POST', headers:{Authorization:'Bearer '+driveToken}, body: form
    });
    if(!res.ok) throw new Error('Upload failed ('+res.status+')');
    const json = await res.json();
    d.driveFileId = json.id; d.driveLink = json.webViewLink || ('https://drive.google.com/file/d/'+json.id+'/view');
    saveKey('documents'); toast('Uploaded to Drive'); route();
  }catch(e){ toast('Drive upload failed: '+e.message); }
}

/* ============== INIT ============== */
loadDB();
registerServiceWorker();
</script>
